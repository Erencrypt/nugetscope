# Publishes nugetscope to nuget.org when a version tag (v1.2.3) is pushed.
# Uses nuget.org Trusted Publishing: no stored API key, only the NUGET_USER secret (nuget.org profile name).
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    # Windows: the tests (path fixtures) have only been verified there so far.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet/login

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test

      - name: Pack
        run: dotnet pack NugetScope.Tui -c Release -o out -p:Version="${GITHUB_REF_NAME#v}"

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push out/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
